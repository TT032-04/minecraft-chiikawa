name: Build jar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read target JDK from gradle.properties
        id: props
        shell: bash
        run: |
          echo "java_version=$(grep -E '^java_version=' gradle.properties | head -n1 | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.props.outputs.java_version }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble all loaders
        run: ./gradlew assemble --no-daemon -x javadoc

      - name: Run data generation
        run: ./gradlew datagenAll --no-daemon -x javadoc

      - name: Collect release jars
        run: ./gradlew releaseJars --no-daemon -x javadoc

      - name: Upload the Forge jar
        uses: actions/upload-artifact@v4
        with:
          name: chiikawa-forge-jar
          path: build/release/forge/*.jar
          if-no-files-found: error
          retention-days: 14
